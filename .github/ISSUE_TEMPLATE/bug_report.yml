name: "🐛 Bug Report"
description: "Report issues with window snapping, gesture recognition, stutter, multi-display, empty desktop cleanup, or Settings UI"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please include your environment details and clear reproduction steps below.
  - type: textarea
    id: summary
    attributes:
      label: Description & Steps to Reproduce
      description: Describe what went wrong and how to reproduce it reliably.
      placeholder: |
        1. Open Safari and Finder...
        2. Hold the trigger key and drag a window / draw a ← gesture...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual Behavior
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: gessnap_version
    attributes:
      label: GesSnap Version & Build
      description: For example `0.1.0 (50)`
      placeholder: "0.1.0 (50)"
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      placeholder: "macOS 15.3"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac Chip Architecture
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4)"
        - "Intel"
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility Permission Status
      options:
        - "Granted"
        - "Not granted or re-prompted"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: displays
    attributes:
      label: Display Setup
      options:
        - "Single display (MacBook built-in / notch / standard)"
        - "Multi-display (laptop + external monitor)"
        - "Multiple external monitors"
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, Screen Recording, or Notes
      description: You can drag and drop screenshots or short clips directly here. Mention target app names (e.g., Chrome, VS Code, Finder) if relevant.
