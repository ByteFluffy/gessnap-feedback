name: "💡 Feature Request"
description: "Suggest a new workflow, snapping interaction, gesture, or automation rule"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case & Problem
      description: Describe your Mac window workflow and which step feels slow or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the ideal behavior, trigger, or configuration option.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Related Area
      options:
        - "Mouse Gestures"
        - "Trackpad & Magic Mouse"
        - "Drag Snapping & Layout Editor"
        - "Hotkeys"
        - "Hot Corners"
        - "Multi-display & Workspace Restore"
        - "Empty Desktop Cleanup"
        - "Scroll & Script Library"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: beta
    attributes:
      label: Willing to test preview builds?
      options:
        - "Yes"
        - "Release only"
